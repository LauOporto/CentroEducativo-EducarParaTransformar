services:
  - type: web
    name: educar-para-transformar
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@11.1.1 && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm --filter backend run deploy:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 24h
      # Sin disco persistente en el plan free: los archivos subidos se
      # pierden si el servicio se reinicia/redeploya. Limitación
      # conocida, ver DEPLOY.md.
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: 20
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Se completan a mano en el dashboard de Render (ver DEPLOY.md):
      # DATABASE_URL depende de Neon, CORS_ORIGIN del dominio que
      # Render asigna recién en el primer deploy.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
