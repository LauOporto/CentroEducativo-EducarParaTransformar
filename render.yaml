services:
  - type: web
    name: educar-para-transformar
    runtime: node
    plan: free
    # Solo despliega commits de main cuyo CI (GitHub Actions) pasó.
    autoDeployTrigger: checksPass
    buildCommand: npm install -g pnpm@11.1.1 && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm --filter backend run deploy:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 24h
      - key: MAX_UPLOAD_SIZE_MB
        value: 20
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Se completan a mano en el dashboard de Render (ver DEPLOY.md):
      # DATABASE_URL depende de Neon, CORS_ORIGIN del dominio que Render
      # asigna recién en el primer deploy, y las 3 de Cloudinary de la
      # cuenta free (sin disco persistente, los archivos subidos viven ahí).
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Mails (HU9): ver DEPLOY.md, paso 7. Opcionales: sin RESEND_API_KEY
      # los mails solo quedan en el log; sin CRON_SECRET no corre ningún job.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_REDIRECT_TO
        sync: false
      - key: CRON_SECRET
        sync: false
      # Opcionales: casilla que recibe las consultas web y puentes/no
      # laborables del año (ver backend/.env.example).
      - key: CONTACTO_EMAIL
        sync: false
      - key: FERIADOS_EXTRA
        sync: false
