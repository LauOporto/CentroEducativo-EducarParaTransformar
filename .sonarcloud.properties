# SonarCloud — análisis automático (Automatic Analysis) del repositorio.
# Se activa una sola vez desde sonarcloud.io importando el repo de GitHub;
# desde ahí analiza cada PR y cada push a main sin pasos extra en el CI.
sonar.sources=backend/src,client/src,scripts
sonar.exclusions=**/*.test.ts,**/dist/**
sonar.tests=backend/src,client/cypress
sonar.test.inclusions=**/*.test.ts,**/*.cy.js
sonar.sourceEncoding=UTF-8
