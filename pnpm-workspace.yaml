packages:
  - 'backend'
  - 'client'

# Habilita los install scripts nativos que necesitan estas deps:
# - prisma / @prisma/* descargan engines nativos
# - bcrypt compila su módulo nativo
# - esbuild extrae su binario nativo (usado por tsx y Vite)
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
  # cypress: el binario (~500 MB) se baja aparte con `pnpm --filter client exec cypress install`,
  # solo donde se corren las pruebas E2E (local y CI), nunca en el build de Render.
  cypress: false
